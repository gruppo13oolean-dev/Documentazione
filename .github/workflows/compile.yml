name: Compilazione Documentazione LaTeX

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/compile-verbali.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

# Annulla le esecuzioni ancora in corso sullo stesso ref quando ne viene avviata una nuova.
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Individuazione dei documenti da compilare
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          compile_all=false
          changed=""

          # Determina l'intervallo di commit da confrontare in base all'evento.
          case "$EVENT" in
            workflow_dispatch) compile_all=true ;;
            pull_request)      range="$BASE_SHA...$HEAD_SHA" ;;
            push)
              if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
                # Primo push di un nuovo branch: non esiste un commit di riferimento.
                compile_all=true
              else
                range="$BEFORE..$SHA"
              fi ;;
          esac

          if [ "$compile_all" = false ]; then
            changed=$(git diff --name-only "$range") || compile_all=true
            # Una modifica al workflow richiede la ricompilazione completa.
            if grep -q '^\.github/workflows/' <<<"$changed"; then compile_all=true; fi
          fi

          : > roots.list
          count=0
          while IFS= read -r -d '' tex; do
            # Sono considerati documenti principali i file con \documentclass non commentato.
            grep -qE '^[^%]*\\documentclass' "$tex" || continue
            dir=$(dirname "$tex")
            # Il documento viene compilato solo se la sua cartella contiene file modificati.
            if [ "$compile_all" = true ] || grep -q "^${dir}/" <<<"$changed"; then
              printf '%s\0' "$tex" >> roots.list
              count=$((count + 1))
              echo "Da compilare: $tex"
            fi
          done < <(find src -type f -name '*.tex' -print0)

          echo "Documenti da compilare: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Download dell'immagine TeX Live
        if: steps.detect.outputs.count != '0'
        timeout-minutes: 10
        run: docker pull texlive/texlive:latest

      - name: Compilazione dei documenti principali
        if: steps.detect.outputs.count != '0'
        run: |
          cat > "$RUNNER_TEMP/compila.sh" <<'EOF'
          set -euo pipefail

          # Compila un singolo documento e ne copia il PDF in output/ e nella cartella di anteprima.
          compila() {
            local tex="$1" dir file name rel target log texlog
            dir=$(dirname "$tex")
            file=$(basename "$tex")
            name="${file%.tex}"
            rel="${dir#src}"; rel="${rel#/}"
            target="output/${rel}"
            mkdir -p "$target"
            log=$(mktemp)

            # La compilazione avviene nella cartella del documento, così che i percorsi
            # relativi usati da \input e \includegraphics vengano risolti correttamente.
            if (cd "$dir" && latexmk -pdf -interaction=nonstopmode -halt-on-error -silent "$file") >"$log" 2>&1; then
              cp "$dir/${name}.pdf" "$target/"
              # Copia destinata all'artifact: contiene solo i PDF compilati in questa esecuzione.
              mkdir -p "/anteprima/${rel}"
              cp "$dir/${name}.pdf" "/anteprima/${rel}/"
              echo "[OK] $tex -> $target/${name}.pdf"
            else
              texlog="$dir/${name}.log"
              echo "::group::[ERRORE] $tex"
              echo "----- Output di latexmk -----"
              cat "$log"
              if [ -f "$texlog" ]; then
                # Con -silent l'errore effettivo è riportato solo nel file .log di LaTeX:
                # si estraggono le righe di errore (prefisso "!") con il relativo contesto.
                echo "----- Errori riportati in ${name}.log -----"
                grep -n -A8 -E '^!|LaTeX Error|not found|Emergency stop' "$texlog" | head -n 80 || true
                echo "----- Ultime righe di ${name}.log -----"
                tail -n 25 "$texlog"
              else
                echo "File ${name}.log non generato."
              fi
              echo "::endgroup::"
              # Primo messaggio di errore, mostrato come annotazione nel riepilogo dell'esecuzione.
              local first_error=""
              [ -f "$texlog" ] && first_error=$(grep -m1 -E '^!' "$texlog" | sed 's/^! *//' || true)
              echo "::error file=$tex::Compilazione fallita${first_error:+: $first_error}"
              return 1
            fi
          }
          export -f compila

          # Esegue un processo di compilazione per ogni core disponibile.
          xargs -0 -r -n1 -P "$(nproc)" bash -c 'compila "$1"' _ < roots.list
          EOF

          # Cartella temporanea, esterna al repository, destinata all'artifact di anteprima.
          # Viene creata prima dell'avvio del container affinché appartenga all'utente del runner.
          mkdir -p "$RUNNER_TEMP/anteprima"

          # Esecuzione nel container TeX Live con l'utente del runner, così che i file
          # generati non risultino di proprietà di root.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD":/work \
            -v "$RUNNER_TEMP/compila.sh":/compila.sh:ro \
            -v "$RUNNER_TEMP/anteprima":/anteprima \
            -w /work \
            texlive/texlive:latest \
            bash /compila.sh

      - name: Preparazione del nome dell'artifact
        if: steps.detect.outputs.count != '0'
        id: nome
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        # I caratteri non ammessi nei nomi degli artifact (ad es. "/" in "12/merge") vengono sostituiti con "-".
        run: echo "nome=anteprima-pdf-${REF//[\/\\:\"<>|*?]/-}" >> "$GITHUB_OUTPUT"

      - name: Caricamento dell'anteprima PDF
        if: steps.detect.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.nome }}
          path: ${{ runner.temp }}/anteprima
          if-no-files-found: ignore

      - name: Commit e push dei PDF (solo su main)
        if: steps.detect.outputs.count != '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/

          if ! git diff --staged --quiet; then
            git commit -m "Automated PDF update from GitHub Actions"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessuna modifica ai PDF da salvare nel repository."
          fi