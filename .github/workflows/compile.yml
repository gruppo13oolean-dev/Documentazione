name: Compilazione Verbali LaTeX

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/compile-verbali.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Scarica la cronologia completa per consentire il push senza conflitti
          fetch-depth: 0

      - name: Installa ambiente TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-lang-italian latexmk

      - name: Compilazione e replica della struttura cartelle
        run: |
          # Trova tutti i file .tex dentro la cartella src/
          find "src" -type f -name "*.tex" | while read -r tex_file; do
            dir=$(dirname "$tex_file")
            file=$(basename "$tex_file")
            echo "Elaborazione di: $tex_file"

            # 1. Calcola il percorso di output speculare (sostituisce src/ con output/)
            # Es: src/Verbali/Verbali interni/verbale_15-10-26 -> output/Verbali/Verbali interni/verbale_15-10-26
            target_dir="output/${dir#src/}"
            mkdir -p "$target_dir"

            # 2. Compila LaTeX dentro la cartella sorgente per risolvere riferimenti e asset
            (
              cd "$dir"
              latexmk -pdf -interaction=nonstopmode "$file"
            )

            # 3. Sposta il PDF compilato nella cartella speculare di output
            pdf_name="${file%.tex}.pdf"
            if [ -f "$dir/$pdf_name" ]; then
              cp "$dir/$pdf_name" "$target_dir/"
              echo "PDF posizionato in: $target_dir/$pdf_name"
            fi
          done

      - name: Commit e Push automatico dei PDF nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Aggiunge tutti i PDF aggiornati nella cartella output
          git add output/

          # Esegue il commit solo se ci sono effettive modifiche ai PDF
          if ! git diff --staged --quiet; then
            git commit -m "Automated update from GitHub Actions"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessuna modifica ai PDF da salvare nel repository."
          fi