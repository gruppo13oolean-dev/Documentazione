name: Compilazione Documentazione LaTeX

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/compile-verbali.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installa ambiente TeX Live
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-italian \
            latexmk

      - name: Compilazione dei soli file principali (con \documentclass)
        run: |
          set -e
          # Cerca tutti i file .tex ma compila solo i file radice che contengono \documentclass
          while IFS= read -r -d '' tex_file; do
            if grep -q "\\documentclass" "$tex_file"; then
              dir=$(dirname "$tex_file")
              file=$(basename "$tex_file")
              echo "=== Compilazione documento principale: $tex_file ==="
              
              target_dir="output/${dir#src/}"
              mkdir -p "$target_dir"
              
              # Entra nella cartella del file principale così \input{...} risolve i percorsi relativi
              (
                cd "$dir"
                latexmk -pdf -interaction=nonstopmode -halt-on-error "$file"
              )
              
              pdf_name="${file%.tex}.pdf"
              if [ -f "$dir/$pdf_name" ]; then
                cp "$dir/$pdf_name" "$target_dir/"
                echo "PDF generato in: $target_dir/$pdf_name"
              fi
            else
              echo "Saltato file incluso con \\input: $tex_file"
            fi
          done < <(find "src" -type f -name "*.tex" -print0)

      - name: Carica anteprima PDF (scaricabile dalla pagina Actions)
        uses: actions/upload-artifact@v4
        with:
          name: anteprima-pdf-${{ github.ref_name }}
          path: output/**/*.pdf
          if-no-files-found: ignore

      - name: Commit e Push automatico dei PDF (SOLO su main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/
          
          if ! git diff --staged --quiet; then
            git commit -m "Automated PDF update from GitHub Actions"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessuna modifica ai PDF da salvare nel repository."
          fi